name: Build and deploy

# Every push and pull request is linted, unit tested, built and end-to-end
# tested. Deploying to Cloudflare Workers is opt-in, so forks stay green: set
# the repository variable CLOUDFLARE_DEPLOY to "true" and add the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. See "Deploying" in
# the README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Holds the bundled songbooks and the exporter to the songbook schema.
      - run: npm test

      # End-to-end tests drive a build in headless Chromium. It uses the small
      # soundfont alphaTab ships with: the hosted copy (SOUNDFONT_URL) only
      # allows the production origin, so playback would fail on localhost.
      - name: Build for end-to-end tests
        run: npm run build
        env:
          VITE_SOUNDFONT_URL: /soundfont/sonivox.sf3

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The 40 MB soundfont is over Cloudflare's 25 MiB per-file limit, so
      # playback uses SOUNDFONT_URL (a hosted copy) or else the small bank
      # alphaTab ships with. This build replaces the test build in dist/.
      - run: npm run build
        env:
          VITE_SOUNDFONT_URL: ${{ vars.SOUNDFONT_URL || '/soundfont/sonivox.sf3' }}

      # DEPLOY_DOMAIN (optional) serves the Worker on that custom domain and
      # turns off its workers.dev URL.
      - name: Use custom domain
        if: vars.DEPLOY_DOMAIN != ''
        run: |
          sed -i 's/"workers_dev": true/"workers_dev": false/' wrangler.jsonc

      - name: Deploy
        if: >-
          vars.CLOUDFLARE_DEPLOY == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          # Pinned so deploys are reproducible; keep in step with local Wrangler.
          wranglerVersion: '4.137.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy${{ vars.DEPLOY_DOMAIN != '' && format(' --domain {0}', vars.DEPLOY_DOMAIN) || '' }}
